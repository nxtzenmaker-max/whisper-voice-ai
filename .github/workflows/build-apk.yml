name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Jarvis-Voice-Assistant.apk
          ls -lh Jarvis-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Voice-Assistant-APK
          path: Jarvis-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0-apk
          name: "Jarvis Voice Assistant Android APK (v1.0)"
          body: |
            ### 🎙️ Jarvis Voice Assistant Android APK
            
            ✅ **Features**:
            - **Microphone & Foreground Service**: Works seamlessly on Android 10-14.
            - **Voice Biometrics Verification**: 20-band Mel Filterbank + YIN Pitch algorithm matching web Turso DB samples.
            - **Strict Security Gatekeeper**:
              - **Owner (Aap)**: Speaks response using **Prabhat (+20% speed)** Edge-TTS.
              - **Stranger (Mummy, friends, unknown)**: 100% **SILENT** (no reply, access denied).
            - **Direct Verification API**: Connects to `whisper-voice-ai.vercel.app`.
            
            📥 **How to Install**:
            1. Download `Jarvis-Voice-Assistant.apk` below.
            2. Open the file on your Android device and tap "Install" (allow "Install unknown apps" if prompted).
            3. Open the app and grant Microphone & Notification permissions.
            4. Tap the Microphone button and speak!
          draft: false
          prerelease: false
          files: Jarvis-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
