name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Jarvis-Voice-Assistant.apk
          ls -lh Jarvis-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Voice-Assistant-APK
          path: Jarvis-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.1-apk
          name: "Jarvis Voice Assistant Android APK (v1.1 - Always-Listening)"
          body: |
            ### 🎙️ Jarvis Voice Assistant Android APK (v1.1)
            
            ✅ **NEW in v1.1**:
            - 🟢 **Continuous Background Listening (Always-On Ear)**: Works when phone is locked, app is in the background, or swiped from recent apps!
            - ⚡ **Energy-Based Voice Activity Detector (VAD)**: Minimal battery usage; activates on speech.
            - 🛡️ **Echo Prevention**: Automatically mutes the mic while Jarvis speaks to avoid self-triggering loops.
            - 🔐 **Biometric Gatekeeper**: Strictly verifies owner vs stranger before responding.
            - 🗣️ **Prabhat Voice (+20% speed)**: Natural Indian male voice replies.
            
            📥 **How to Install**:
            1. Download `Jarvis-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update" on your Android device.
            3. Open the app and ensure "Continuous Background Listening" is ON.
            4. Lock your phone or swipe from recents, speak naturally, and Jarvis will reply!
          draft: false
          prerelease: false
          files: Jarvis-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
