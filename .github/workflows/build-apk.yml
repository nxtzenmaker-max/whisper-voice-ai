name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.2-apk
          name: "ROX Voice Assistant Android APK (v2.2 - Pure Neural Human Voice & 'Rox on/off' Voice Codes)"
          body: |
            ### 🔮 ROX Voice Assistant Android APK (v2.2 - Pure Neural Voice & Code Words)
            
            ✅ **Major Enhancements in v2.2**:
            - 🎙️ **Direct Pure Neural Edge-TTS Engine**: Fixed the monotone "reading text like a robot" issue! Powered by pure Node.js Edge-TTS engine with DRM Sec-MS-GEC v2 support. Generates rich, alive, human-like Indian neural voice (`hi-IN-MadhurNeural`) with zero robotic fallback.
            - 🗣️ **Official Voice Code Words Supported**:
              - **Turn ON / Wake**: *"Rox on"*, *"Rox 7"*, *"Rox start"*, *"Rox chalu ho jao"*, *"Rox suno"*.
              - **Turn OFF / Sleep**: *"Rox off"*, *"Rox band ho jao"*, *"Rox stop"*, *"Rox close"*, *"so jao"*, *"alvida"*.
            - 💬 **Human Conversational Tone**: Rox now speaks like a real Indian buddy/brother on a phone call with natural breathing pauses (`...`, `,`) and colloquial warmth rather than reading written paragraphs.
            - 📏 **Zero-Tap Continuous Hands-Free & Zero Ghost Board**: Fluid hands-free continuous conversations with compact overlay bounds.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Grant "Display over other apps", "Microphone", and "Accessibility".
            4. Drag "Rox AI" into Quick Settings or press Volume Down 3 times!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
