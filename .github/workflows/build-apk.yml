name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.5-apk
          name: "ROX Voice Assistant Android APK (v1.5 - Loudspeaker Audio Fixed)"
          body: |
            ### 🎙️ ROX Voice Assistant Android APK (v1.5)
            
            ✅ **Features**:
            - 🤖 **Official Rebrand to ROX AI**: Your personalized Indian voice assistant.
            - 🟢 **Continuous Background Listening (Always-On Ear)**: Works when phone is locked, app is in the background, or swiped from recent apps!
            - ⚡ **Energy-Based Voice Activity Detector (VAD)**: Minimal battery usage; activates on speech.
            - 🛡️ **Echo Prevention**: Automatically mutes the mic while ROX speaks to avoid self-triggering loops.
            - 🔐 **Biometric Gatekeeper**: Strictly verifies owner vs stranger before responding.
            - 🗣️ **Prabhat Voice (+20% speed)**: Natural Indian male voice replies.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update" on your Android device.
            3. Open the app and ensure "Continuous Background Listening" is ON.
            4. Lock your phone or swipe from recents, speak naturally, and ROX will reply!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
