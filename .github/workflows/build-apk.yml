name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0-apk
          name: "ROX Voice Assistant Android APK (v2.0 - Groq AI Brain & Custom Logo)"
          body: |
            ### 🔮 ROX Voice Assistant Android APK (v2.0 - Groq AI Brain & Gesture Dismiss)
            
            ✅ **What's New in v2.0**:
            - 🤖 **Groq AI Brain Integrated**: Rox is now powered by Groq LPU with Qwen 27B / GPT-OSS! Ask anything (weather, general knowledge, jokes, tech, conversation) and Rox speaks intelligent answers in Prabhat's natural Hindi-English voice!
            - 🖼️ **New Official Custom Logo**: Installed your custom 1254x1254 logo across launcher icons, mipmaps, and app UI.
            - 🚫 **Cross (✕) Button Removed**: Overlay is now a clean, unobstructed, floating 3D glowing WebGL orb!
            - ⬇️ **Slide Down To Turn Off (Swipe-To-Dismiss)**: Simply slide or flick the 3D orb downward to shut down Rox anytime with haptic feedback!
            - 🎙️ **Prabhat Neural Voice & Internal AudioRecord**: 100% Google popups removed, high-precision Hinglish voice answers, live audio-reactive 3D orb vibration.
            - 🔑 **Smart Phonetic Tolerance & Tap-to-Unlock**: Fast unlock with voice ("Rox 7", "Rocs", "7", etc.) or single tap on the orb.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Grant "Display over other apps", "Microphone", and "Accessibility" (Volume 3x trigger).
            4. Drag "Rox AI" into Quick Settings or press Volume Down 3 times!
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Grant "Display over other apps", "Microphone", and "Accessibility" (Volume 3x trigger).
            4. Drag "Rox AI" into Quick Settings or press Volume Down 3 times!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
