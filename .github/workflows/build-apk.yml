name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.8-apk
          name: "ROX Voice Assistant Android APK (v1.8 - Fix Quick Settings Tile Launch)"
          body: |
            ### 🔮 ROX Voice Assistant Android APK (v1.8 - Tile Fix)
            
            ✅ **Fixes & Enhancements**:
            - 🛠️ **Fixed Quick Settings Tile (Upar ka tool button)**: Added transparent trampoline activity & Android 14 `PendingIntent` so tapping the "Rox AI" tile opens the floating 3D orb instantly without crashing or getting blocked!
            - 🌐 **Floating Transparent 3D Orb Overlay**: Pops up directly over your current screen (WhatsApp, YouTube, Home Screen) with a completely transparent background!
            - 🔊 **Volume Down 3x Trigger**: Press Volume Down 3 times quickly anywhere on phone to activate with haptic vibration!
            - 🗣️ **Voice Code Word Activation**: Rox says *"Rox activated, send your code with your voice to start"* -> speak code word (Default: `Rox 7`) -> full assistant unlocks!
            - 🛡️ **Anti-Shutdown Protection**: Persistent foreground service that only shuts down on your voice command (*"Rox close"*, *"Rox stop"*, *"Rox shutdown"*).
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Grant "Draw Over Other Apps", "Microphone", and "Volume 3x Trigger" in Accessibility.
            4. Drag "Rox AI" into your Quick Settings panel!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
