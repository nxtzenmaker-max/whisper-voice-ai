name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.7-apk
          name: "ROX Voice Assistant Android APK (v1.7 - Floating 3D Orb, Quick Tile & Volume 3x)"
          body: |
            ### 🔮 ROX Voice Assistant Android APK (v1.7)
            
            ✅ **All New Features**:
            - 🌐 **Floating Transparent 3D Orb Overlay**: Pops up directly over your current screen (WhatsApp, YouTube, Home Screen) with a completely transparent background!
            - 🎛️ **Quick Settings Tile (Torch / Mute panel)**: Swipe down notification shade and tap **"Rox AI"** to summon Rox in 1 tap.
            - 🔊 **Volume Down 3x Trigger**: Press Volume Down 3 times quickly anywhere on phone to activate with haptic feedback!
            - 🗣️ **Voice Code Word Activation**: Rox says *"Rox activated, send your code with your voice to start"* -> say your code word (Default: `Rox 7`) -> full assistant unlocks!
            - 🛡️ **Anti-Shutdown Protection**: Runs as a persistent foreground service. Only shuts down on your voice command (*"Rox close"*, *"Rox stop"*, *"Rox shutdown"*).
            - 🎵 **Audio-Reactive 3D WebGL Orb**: Orb reacts dynamically to live voice frequencies and speech.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update" on your Android device.
            3. Grant "Draw Over Other Apps", "Microphone", and "Volume 3x Trigger" in Accessibility.
            4. Drag "Rox AI" into your Quick Settings panel!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
