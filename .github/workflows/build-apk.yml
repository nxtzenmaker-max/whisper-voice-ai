name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.3-apk
          name: "ROX Voice Assistant Android APK (v2.3 - Clean Floating Orb & Removed Subtitles)"
          body: |
            ### 🔮 ROX Voice Assistant Android APK (v2.3 - Pure Clean Orb)
            
            ✅ **Major Enhancements in v2.3**:
            - 🧼 **Clean Minimal Orb (Removed Text Underneath)**: Removed the status text / subtitle pill from below the 3D orb. Now you get a pure, distraction-free floating 3D glowing orb with zero clutter.
            - 📐 **Ultra-Compact Window (150dp x 150dp)**: Without the text pill, the floating overlay is reduced to an ultra-compact circular footprint, completely eliminating screen blocking.
            - 🎙️ **Pure Neural Indian Voice Engine (`hi-IN-MadhurNeural`)**: Direct Node.js Edge-TTS engine with full Sec-MS-GEC v2 support.
            - 🗣️ **Instant Voice Code Words**: *"Rox on"* / *"Rox 7"* to activate, *"Rox off"* / *"so jao"* to sleep.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Grant "Display over other apps", "Microphone", and "Accessibility".
            4. Drag "Rox AI" into Quick Settings or press Volume Down 3 times!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
