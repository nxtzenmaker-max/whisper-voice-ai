name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.4-apk
          name: "ROX Voice Assistant Android APK (v2.4 - Instant Screen Controls & Zero-Lag Voice)"
          body: |
            ### 🔮 ROX Voice Assistant Android APK (v2.4 - Screen Controls & Instant Response)
            
            ✅ **Major Enhancements in v2.4**:
            - ⚡ **Zero-Lag Speech & TTS Fix (Khatam Hua Atakna & Delay)**:
              - Removed slow secondary server-side transliteration LLM call from `/api/transcribe`, saving 2+ seconds per voice command!
              - Switched Android TTS playback from sluggish `MediaPlayer.setDataSource(url)` streaming to ultra-fast OkHttp streaming into local cache (<5ms instant playback), completely eliminating network audio freezing ("atakna band!").
              - Added immediate offline fallback watchdog so Rox never hangs in silence.
              - Ambient room noise filter ignores empty/micro sound bursts immediately.
            - 📱 **Full Voice Screen Controls Suite**:
              - **Navigation**: *"Home jao"*, *"Back karo"*, *"Recent apps kholo"*, *"Notifications dikhao"*, *"Quick settings kholo"*.
              - **Actions & Gestures**: *"Screenshot lo"*, *"Screen lock karo"*, *"Neeche scroll karo"*, *"Upar scroll karo"*.
              - **App Launcher**: *"WhatsApp kholo"*, *"YouTube chalao"*, *"Camera open karo"*, *"Instagram kholo"*, *"Settings kholo"*, etc.
              - **Hardware Controls**: *"Torch on / off karo"*, *"Volume badhao / kam karo"*, *"Mute karo"*.
            - 🧼 **Clean Minimal Orb (150dp x 150dp)**: Subtitle text pill removed, pure floating 3D glowing orb with zero screen blocking.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Grant "Display over other apps", "Microphone", and "Accessibility".
            4. Drag "Rox AI" into Quick Settings or press Volume Down 3 times!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
