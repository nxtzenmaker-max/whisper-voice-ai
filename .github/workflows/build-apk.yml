name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.1-apk
          name: "ROX Voice Assistant Android APK (v2.1 - Emotional Voice & Zero-Tap Mic)"
          body: |
            ### 🔮 ROX Voice Assistant Android APK (v2.1 - Emotional Voice & Zero-Tap Mic)
            
            ✅ **Major Enhancements**:
            - 🎭 **Emotional Voice Upgrade (Madhur Neural)**: Switched to Microsoft's native Hindi male neural voice (`hi-IN-MadhurNeural`) with dynamic pitch (+2Hz) and human conversational speed (+5%). Sounds warm, alive, energetic, and expressive!
            - 🗣️ **Zero-Tap Continuous Hands-Free Conversation**: No more tapping the orb to speak! As soon as Rox finishes speaking an answer, it automatically resumes listening for your next question seamlessly.
            - 📏 **Invisible Board Removed / Compact Floating Orb**: Reduced overlay window to a sleek 165dp x 195dp hugging the 3D orb. Touches outside the orb now pass through freely to underlying apps with zero blocking!
            - 🤖 **Charismatic AI Personality**: Rox speaks like a witty, intelligent, brotherly companion ("Arrey waah boss!", "Haha bilkul!", "Arey fikar mat karo...").
            - 🎙️ **Voice Selector in Settings**: Easily switch between Madhur (Emotional Hindi), Swara (Expressive Female), and Prabhat (Tech Male) anytime.
            - ⬇️ **Slide Down to Turn Off**: Smooth gesture dismiss by sliding the 3D orb downward.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Grant "Display over other apps", "Microphone", and "Accessibility" (Volume 3x trigger).
            4. Drag "Rox AI" into Quick Settings or press Volume Down 3 times!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
