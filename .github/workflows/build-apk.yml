name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.7-apk
          name: "ROX Voice Assistant Android APK (v2.7 - Devanagari Hindi Diction & Snappy 1.15x Speed)"
          body: |
            ### 🎙️ ROX Voice Assistant Android APK (v2.7 - Devanagari Hindi Diction & 1.15x Speed)
            
            ✅ **Major Enhancements in v2.7**:
            - 🇮🇳 **Flawless Indian Hindi Diction (Devanagari Script Engine)**:
              - AI Brain aur System Responses ab natural Devanagari Hindi me render hote hain jisse ElevenLabs Multilingual v2.5 English accent chhod kar **100% native Indian human pronunciation aur emotions** se bolta hai!
              - Zero foreign accent on common Indian colloquial words (*"अरे भाई!", "बिल्कुल यार", "व्हाट्सएप", "मैसेज"*).
            - ⚡ **Snappy 1.15x Speaking Speed**:
              - Speech synthesis speed ko naturally 1.15x boost kiya gaya hai taaki Rox lazy/slow na lage balki energetic aur snappy lage.
            - 🎭 **ElevenLabs Ultra-Emotional TTS Integration**:
              - Default voice: **Adam** (Deep & Charismatic).
              - Also available: Rachel, Antoni, Bella, Daniel, plus Edge-TTS Madhur & Swara.
            - 💬 **WhatsApp Direct Voice Messaging & Auto-Send**:
              - Phone number ya Contact name bol kar seedha message bhejein.
            - 📱 **Full Voice Screen Controls**:
              - Home, Back, Recents, Notifications, Quick Settings, Screenshot, Screen Lock, Scroll, Torch, Volume.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Enjoy natural, fast Hindi conversations with Rox!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
