name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.6-apk
          name: "ROX Voice Assistant Android APK (v2.6 - ElevenLabs Ultra-Emotional Voice)"
          body: |
            ### 🎙️ ROX Voice Assistant Android APK (v2.6 - ElevenLabs Ultra-Emotional Voice)
            
            ✅ **Major Enhancements in v2.6**:
            - 🎭 **ElevenLabs Ultra-Emotional TTS Integration**:
              - Rox ab neutral/robotic nahi balki **insan ki tarah emotional, expressive aur natural Hinglish/Hindi** bolega!
              - Powered by **ElevenLabs Turbo v2.5** (< 250ms ultra-low latency direct playback).
              - Default voice: **Adam** (Deep, Charismatic & Emotional Male).
              - Other voices selectable from settings: **Rachel** (Warm Female), **Antoni** (Energetic Male), **Bella** (Expressive Female), **Daniel** (Deep Male).
              - Seamless multi-layer fallback: ElevenLabs ➔ Edge-TTS (`hi-IN-MadhurNeural`) ➔ Local Android TTS. Rox kabhi chup ya hang nahi hoga!
            - 💬 **WhatsApp Direct Voice Messaging & Auto-Send**:
              - Phone number ya Saved Contact name bol kar seedha message bhejein, auto-send button tap hota hai.
            - 📱 **Full Voice Screen Controls**:
              - Home, Back, Recents, Notifications, Quick Settings, Screenshot, Screen Lock, Scroll, Torch, Volume.
            - 🧼 **Clean Minimal Orb (150dp x 150dp)** with zero screen blockage.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Tap Voice row in the app to switch between Adam, Rachel, Antoni, Bella, or Madhur.
            4. Start talking with Rox!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
