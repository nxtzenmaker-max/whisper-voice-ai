name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rox-Voice-Assistant.apk
          ls -lh Rox-Voice-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rox-Voice-Assistant-APK
          path: Rox-Voice-Assistant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.9-apk
          name: "ROX Voice Assistant Android APK (v1.9 - Prabhat Voice & Internal Mic Fix)"
          body: |
            ### 🔮 ROX Voice Assistant Android APK (v1.9 - Prabhat Voice & Mic Upgrade)
            
            ✅ **Major Fixes & Upgrades**:
            - 🎙️ **Prabhat Voice (`en-IN-PrabhatNeural`)**: Replaced Android's robotic female TTS with authentic Prabhat Neural TTS via Microsoft Edge engine. Rox now speaks in a natural Hindi-English male voice!
            - 🔇 **Zero Google Popups / Direct Internal Mic**: Removed Google SpeechRecognizer completely. Now uses direct hardware PCM `AudioRecord` with real-time RMS energy and Whisper AI backend! Zero Google chimes, zero Google dialogs, and zero crash loops.
            - 🔊 **Live Audio-Reactive 3D Orb**: Real-time microphone audio frequency is streamed directly into the 3D WebGL Orb, so it vibrates and pulses smoothly in real time with your voice!
            - 🧠 **Smart Phonetic Tolerance for Code Word**: Saying "Rox 7", "Rocs", "Rocks", "Rox seven", "7", etc. is automatically recognized without false rejections.
            - 👆 **Instant Tap-to-Unlock Fallback**: You can also simply tap the 3D Orb to instantly verify and unlock Rox without saying the code word.
            - ⚙️ **Code Word Customization**: Open the main app to customize your secret code or disable code requirement completely.
            - 🛡️ **Anti-Shutdown Protection**: Rox stays running until you say *"Rox close"*, *"Rox stop"*, *"band ho jao"*, or tap close.
            
            📥 **How to Install**:
            1. Download `Rox-Voice-Assistant.apk` below.
            2. Tap "Install" or "Update".
            3. Grant "Display over other apps", "Microphone", and "Accessibility" (Volume 3x trigger).
            4. Drag "Rox AI" into Quick Settings or press Volume Down 3 times!
          draft: false
          prerelease: false
          files: Rox-Voice-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
