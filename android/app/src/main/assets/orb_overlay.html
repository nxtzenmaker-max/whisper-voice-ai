<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  background: transparent !important;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
#container {
  position: relative;
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
</style>
</head>
<body>

<div id="container">
  <canvas id="gl"></canvas>
  <canvas id="ring"></canvas>
</div>

<script>
const cv = document.getElementById('gl');
const ringCv = document.getElementById('ring');
const DPR = Math.min(2, window.devicePixelRatio || 1);

let W = 150, H = 150;
cv.width = W * DPR; cv.height = H * DPR;
ringCv.width = W * DPR; ringCv.height = H * DPR;

const gl = cv.getContext('webgl2', { alpha: true, premultipliedAlpha: false, antialias: true });
const rctx = ringCv.getContext('2d');

let COL = {
  lo: [1.0, 0.36, 0.23],
  mid: [1.0, 0.72, 0.29],
  hi: [0.35, 0.83, 1.0]
};

// Shaders
const VS = `#version 300 es
precision highp float;
in vec3 aPos;
uniform vec2 uScale, uShake;
uniform float uTime, uYaw, uLevel, uKick;
out vec3 vN; out float vLevel;
void main(){
  vec3 p = normalize(aPos);
  float pulse = sin(uTime * 3.0 + p.y * 4.0) * (0.04 + 0.12 * uLevel);
  pulse += sin(uTime * 5.0 + p.x * 6.0) * (0.02 + 0.08 * uLevel);
  vec3 P = p * (1.0 + pulse + uKick * 0.15);
  vN = P;
  vLevel = uLevel;
  gl_Position = vec4(P.x * uScale.x + uShake.x, P.y * uScale.y + uShake.y, -P.z * 0.2, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
in vec3 vN; in float vLevel;
uniform float uTime;
uniform vec3 uLo, uMid, uHi;
out vec4 fragColor;
void main(){
  vec3 n = normalize(vN);
  float rim = 1.0 - max(0.0, dot(n, vec3(0.0, 0.0, 1.0)));
  rim = pow(rim, 2.2);
  float t = 0.5 + 0.5 * sin(uTime * 1.5 + n.y * 2.0);
  vec3 col = mix(uLo, uMid, t);
  col = mix(col, uHi, rim);
  float alpha = clamp(0.75 + rim * 0.5 + vLevel * 0.25, 0.0, 0.95);
  fragColor = vec4(col, alpha);
}`;

function createShader(gl, type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl, gl.VERTEX_SHADER, VS));
gl.attachShader(prog, createShader(gl, gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);

// Sphere geometry
const SPHERE_SEGS = 48;
const verts = [], inds = [];
for(let y=0; y<=SPHERE_SEGS; y++){
  const v = y / SPHERE_SEGS, lat = (v - 0.5) * Math.PI;
  const sinLat = Math.sin(lat), cosLat = Math.cos(lat);
  for(let x=0; x<=SPHERE_SEGS; x++){
    const u = x / SPHERE_SEGS, lon = u * Math.PI * 2.0;
    verts.push(Math.cos(lon)*cosLat, sinLat, Math.sin(lon)*cosLat);
  }
}
for(let y=0; y<SPHERE_SEGS; y++){
  for(let x=0; x<SPHERE_SEGS; x++){
    const a = y*(SPHERE_SEGS+1)+x, b = a+(SPHERE_SEGS+1);
    inds.push(a, b, a+1, b, b+1, a+1);
  }
}

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

const ibo = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(inds), gl.STATIC_DRAW);

const uScale = gl.getUniformLocation(prog, 'uScale');
const uShake = gl.getUniformLocation(prog, 'uShake');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uLevel = gl.getUniformLocation(prog, 'uLevel');
const uKick = gl.getUniformLocation(prog, 'uKick');
const uLo = gl.getUniformLocation(prog, 'uLo');
const uMid = gl.getUniformLocation(prog, 'uMid');
const uHi = gl.getUniformLocation(prog, 'uHi');

let curLevel = 0.1, curKick = 0;
let curState = 'activating';
let T = 0, last = performance.now();

// State API from Android
window.setRoxState = function(state, text){
  curState = state;
  if(state === 'code_verified' || state === 'listening_cmd'){
    COL = { lo: [0.1, 0.8, 0.6], mid: [0.2, 0.7, 1.0], hi: [0.7, 0.4, 1.0] };
  } else {
    COL = { lo: [1.0, 0.36, 0.23], mid: [1.0, 0.72, 0.29], hi: [0.35, 0.83, 1.0] };
  }
};

window.feedAudioLevel = function(lvl){
  curLevel = Math.max(0, Math.min(1, lvl));
  if(lvl > 0.4) curKick = (lvl - 0.4) * 0.5;
};

// Click handler
document.getElementById('container').addEventListener('click', () => {
  if(window.AndroidBridge && window.AndroidBridge.onOrbTapped){
    window.AndroidBridge.onOrbTapped();
  }
});

function frame(now){
  const dt = (now - last) / 1000;
  last = now;
  T += dt;

  curLevel += (0.05 - curLevel) * Math.min(1, dt * 3.0);
  curKick *= Math.exp(-dt * 6.0);

  // Render WebGL Orb
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0.0, 0.0, 0.0, 0.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(prog);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const S = 0.46;
  gl.uniform2f(uScale, S, S);
  const shakeAmp = curLevel * 0.025;
  gl.uniform2f(uShake, Math.sin(T * 8.0) * shakeAmp, Math.cos(T * 7.0) * shakeAmp * 0.7);
  gl.uniform1f(uTime, T);
  gl.uniform1f(uLevel, curLevel);
  gl.uniform1f(uKick, curKick);
  gl.uniform3fv(uLo, COL.lo);
  gl.uniform3fv(uMid, COL.mid);
  gl.uniform3fv(uHi, COL.hi);

  gl.bindVertexArray(vao);
  gl.drawElements(gl.TRIANGLES, inds.length, gl.UNSIGNED_SHORT, 0);

  // Render 2D spectrum ring
  rctx.clearRect(0, 0, ringCv.width, ringCv.height);
  const cx = ringCv.width / 2, cy = ringCv.height / 2, r0 = ringCv.width * 0.28;
  const bars = 36;
  rctx.lineWidth = 2 * DPR;
  rctx.lineCap = 'round';

  for(let j=0; j<bars; j++){
    const ang = (j / bars) * Math.PI * 2.0;
    const wave = Math.sin(T * 3.0 + j * 0.5) * 0.5 + 0.5;
    const barLen = (4 + wave * 18 * curLevel) * DPR;
    const x1 = cx + Math.cos(ang) * (r0 + 8 * DPR);
    const y1 = cy + Math.sin(ang) * (r0 + 8 * DPR);
    const x2 = cx + Math.cos(ang) * (r0 + 8 * DPR + barLen);
    const y2 = cy + Math.sin(ang) * (r0 + 8 * DPR + barLen);

    rctx.strokeStyle = 'rgba(' + Math.round(COL.mid[0]*255) + ',' + Math.round(COL.mid[1]*255) + ',' + Math.round(COL.mid[2]*255) + ',' + (0.3 + 0.6 * curLevel) + ')';
    rctx.beginPath();
    rctx.moveTo(x1, y1);
    rctx.lineTo(x2, y2);
    rctx.stroke();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
